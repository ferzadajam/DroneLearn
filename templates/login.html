
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Instructor Login | DroneLearn</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .login-container {
            max-width: 440px;
            margin: 90px auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 12px;
        }

        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .login-container label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 22px;
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #173d30;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #245944;
        }

        .login-error {
            color: #b42318;
            background: #fff0ef;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="/" class="brand">
            <img
                src="{{ url_for('static', filename='school-logo.png') }}"
                alt="School Logo"
            >

            <div>
                <strong>DRONELEARN</strong>
                <small>JOSEPH A. TAUB SCHOOL</small>
            </div>
        </a>

        <nav aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/lessons#lesson-1">Lessons</a>
            <a href="/lessons#lesson-2">Safety</a>
            <a href="/lessons#lesson-3">Programming</a>
            <a href="/quiz">Quizzes</a>
            <a href="/login">Dashboard</a>
        </nav>

    </header>

    <main class="login-container">

        <h1>Instructor Login</h1>

        <p>
            Authorized instructors only.
        </p>

        {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">

            <label for="password">
                Instructor Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                autofocus
            >

            <button type="submit">
                Sign In
            </button>

        </form>

    </main>

</body>
</html>
